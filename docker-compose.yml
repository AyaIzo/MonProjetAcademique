version: "3.9"

services:
  formation_service:
    build: ./formation_service
    container_name: formation_service
    ports:
      - "8081:8080"
    networks:
      - formation_net

  inscription_service:
    build: ./inscription_service
    container_name: inscription_service
    ports:
      - "8082:8080"
    networks:
      - formation_net

  student_service:
    build: ./student_service
    container_name: student_service
    ports:
      - "8083:8080"
    networks:
      - formation_net

networks:
  formation_net:
    driver: bridge
