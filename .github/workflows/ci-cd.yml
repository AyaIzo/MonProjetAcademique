name: CI/CD Spring Boot + Docker Compose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Installer JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Build Maven pour chaque service
      - name: Build Spring Boot services
        run: |
          mvn clean package -f formation_service/pom.xml
          mvn clean package -f inscription_service/pom.xml
          mvn clean package -f student_service/pom.xml

      # 4️⃣ Installer Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5️⃣ Build et lancer les containers Docker Compose
      - name: Build and run Docker Compose
        run: |
          docker-compose build
          docker-compose up -d
